<svg width="1080" height="1080" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with Gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a0f" />
      <stop offset="100%" stop-color="#1c2535" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#080a0f" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bgGrad)"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>
  
  <!-- Subtle Grid Lines for Cyberpunk Tech Vibe -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="2">
    <line x1="0" y1="200" x2="1080" y2="200"/>
    <line x1="0" y1="400" x2="1080" y2="400"/>
    <line x1="0" y1="600" x2="1080" y2="600"/>
    <line x1="0" y1="800" x2="1080" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="1080"/>
    <line x1="880" y1="0" x2="880" y2="1080"/>
  </g>
  
  <!-- Problem Statement -->
  <text x="100" y="340" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="85" fill="#ffffff" letter-spacing="-2px">
    <tspan x="100" dy="0">Quantas horas sua</tspan>
    <tspan x="100" dy="100">equipe perde hoje</tspan>
    <tspan x="100" dy="100">em tarefas</tspan>
    <tspan x="100" dy="100" fill="#f97316">repetitivas?</tspan>
  </text>
  
  <!-- Solution Text -->
  <text x="100" y="760" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="40" fill="#a8b3cc">
    <tspan x="100" dy="0">A automação com Inteligência Artificial</tspan>
    <tspan x="100" dy="55">recupera até 40% do tempo operacional</tspan>
    <tspan x="100" dy="55">do seu time para focar em escala.</tspan>
  </text>
  
  <!-- Footer Logo (Dark Theme) -->
  <g transform="translate(100, 930) scale(0.6)">
    <polygon points="60,15 98.97,37.5 98.97,82.5 60,105 21.03,82.5 21.03,37.5" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 40.52 48.75 L 79.48 48.75 L 60 82.5 Z M 40.52 48.75 L 60 15 M 40.52 48.75 L 21.03 37.5 M 40.52 48.75 L 21.03 82.5 M 79.48 48.75 L 60 15 M 79.48 48.75 L 98.97 37.5 M 79.48 48.75 L 98.97 82.5 M 60 82.5 L 98.97 82.5 M 60 82.5 L 60 105 M 60 82.5 L 21.03 82.5" fill="none" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.8" stroke-linejoin="round"/>
    <path d="M 40 80 V 40 H 54 L 70 68 V 40 H 80 V 80 H 66 L 50 52 V 80 Z" fill="#ffffff"/>
    <text x="130" y="78" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="52" letter-spacing="-1px" fill="#ffffff">NAROSCO</text>
  </g>
</svg>
